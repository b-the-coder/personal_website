<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="preference">
      <input type="checkbox" id="dark-mode" class="toggle-input" />
      <label for="dark-mode" class="toggle-label"></label>
      <span class="toggle-text"> Dark Mode</span>
    </div>
    <nav>
      <a href="#aboutme">About Me</a>
      <a href="#experiencelist">Professional Experience</a>
      <a href="#contact">Contact</a>
    </nav>
    <header>
      <h1 id="name">Name</h1>
      <div>
        <p id="email">Email</p>
        <p id="area">Area</p>
      </div>
    </header>
    <main>
      <section id="aboutme">
        <h2>About me:</h2>
        <p id="aboutme-text"></p>
      </section>
      
      <section id="resumeanno"></section>

      <section id="experiencelist">
        <h2>Professional Experience:</h2>
        <ul>
          <li id="proexp1"></li>
          <li id="proexp2"></li>
        </ul>
      </section>

      <section id="contact">
        <h2>Get in touch with me:</h2>
        <div id="contactinfo">
          <a href="mailto:emmahsde@gmail.com" id="email"
            ><ion-icon name="mail-outline"></ion-icon
          ></a>
          <a href="https://github.com/b-the-coder"
            ><ion-icon name="logo-github"></ion-icon
          ></a>
          <a href="https://www.linkedin.com/in/binemmahe/"
            ><ion-icon name="logo-linkedin"></ion-icon
          ></a>
        </div>
      </section>
      <form class="contactForm">
        <h2>Get in touch with me!</h2>
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div>
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button id="submitbutton" type="submit">Send</button>
      </form>
    </main>
    <script type="module" src="script.jsx"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
